name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，避免重复。

        若涉及**安全漏洞**，请勿在此公开，改用[私密漏洞报告](https://github.com/lanlan0811/plainmark/security/advisories/new)。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题
          required: true
        - label: 我使用的是最新版本
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚简洁地描述这个 Bug 是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供可稳定复现的操作步骤
      placeholder: |
        1. 打开文件 '...'
        2. 输入 '...'
        3. 观察到 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: plainmark 版本
      description: 见「关于」对话框或 Release 页面
      placeholder: 例如 v0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 10 22H2 (19045)
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、录屏、日志或其他有助于定位问题的信息
    validations:
      required: false
