name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 构建并签名。签名是自动更新的前提——更新器会校验安装包签名，
      # 没有签名的更新包会被客户端拒绝安装。
      # 私钥来自仓库 Secret，不会写入日志。
      - name: Build & package (Tauri)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 更新清单：Tauri 更新器按 windows-x86_64-<安装器> 查找产物，
      # 因此 exe 装的应用取 nsis 项、msi 装的应用取 msi 项。
      # 用 shell 通配实际文件名，避免因语言后缀等变动而失效。
      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          NSIS_EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          NSIS_SIG="${NSIS_EXE}.sig"
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          MSI_SIG="${MSI}.sig"

          for f in "$NSIS_EXE" "$NSIS_SIG" "$MSI" "$MSI_SIG"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少文件 $f —— 检查 createUpdaterArtifacts 与签名密钥是否配置正确"
              exit 1
            fi
          done

          # 发布说明取自 docs/releases/<tag>.md，作为清单里的 notes
          NOTES_FILE="docs/releases/v${VERSION}.md"
          NOTES=$(if [ -f "$NOTES_FILE" ]; then cat "$NOTES_FILE"; else echo "plainmark ${VERSION}"; fi)

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          node -e '
            const fs = require("fs");
            const [version, base, notes, pubDate, nsisExe, nsisSig, msi, msiSig] = process.argv.slice(1);
            const manifest = {
              version,
              notes,
              pub_date: pubDate,
              platforms: {
                "windows-x86_64-nsis": {
                  signature: fs.readFileSync(nsisSig, "utf8").trim(),
                  url: `${base}/${nsisExe.split(/[\\/]/).pop()}`,
                },
                "windows-x86_64-msi": {
                  signature: fs.readFileSync(msiSig, "utf8").trim(),
                  url: `${base}/${msi.split(/[\\/]/).pop()}`,
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log("latest.json 已生成：");
            console.log(JSON.stringify(manifest, null, 2));
          ' "$VERSION" "$BASE" "$NOTES" "$PUB_DATE" "$NSIS_EXE" "$NSIS_SIG" "$MSI" "$MSI_SIG"

      # 注意必须带上 .sig —— 它是更新器的校验凭据，缺失会导致自动更新失效。
      # 用通配匹配整个目录，避免 *.msi 这类模式漏掉 *.msi.sig。
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: plainmark-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            latest.json
