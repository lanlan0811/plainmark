name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # 门控：Build 全绿 + 由 tag 推送触发（排除手动 dispatch）
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      # 发布说明写在仓库里，必须检出代码才能读到
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 说明文件是发版的硬性前提：缺失即失败，不允许发出没有说明的 Release
      - name: Verify release notes exist
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::缺少发布说明 $NOTES —— 请先提交该文件再打 tag"
            exit 1
          fi
          echo "发布说明：$NOTES"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: plainmark-windows
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show artifacts
        run: ls -R dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          # 正文取自 docs/releases/<tag>.md
          body_path: docs/releases/${{ github.event.workflow_run.head_branch }}.md
          draft: false
          prerelease: false
          files: dist/**/*
