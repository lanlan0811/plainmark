[package]
name = "plainmark"
version = "0.1.6"
description = "像记事本一样简单的 Markdown 编辑器"
authors = ["lanlan0811"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# 库名供移动端与 main.rs 复用
[lib]
name = "plainmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# 安装更新后需重启应用，process 插件提供 relaunch
tauri-plugin-process = "2"
# 记住窗口尺寸与位置
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[features]
# 由 tauri-build 在自定义协议场景下启用
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
# 按速度优化而非体积。's' 会把二进制压得更小，但启动时的解压与分支预测
# 代价更高；实测启动耗时比体积更值得优化。
opt-level = 3
panic = "abort"
strip = true
